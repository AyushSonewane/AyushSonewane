<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Ayush Sonewane, Flutter and Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0F"/>
      <stop offset="1" stop-color="#14112A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6FF3D"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <radialGradient id="violet"><stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.40"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="lime"><stop offset="0" stop-color="#C6FF3D" stop-opacity="0.30"/><stop offset="1" stop-color="#C6FF3D" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- floating glow orbs -->
    <circle cx="150" cy="60" r="230" fill="url(#violet)">
      <animate attributeName="cx" values="150;260;150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;110;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="240" r="220" fill="url(#cyan)">
      <animate attributeName="cx" values="860;760;860" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;180;240" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="-10" r="170" fill="url(#lime)">
      <animate attributeName="cx" values="520;640;520" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- corner brackets -->
    <path d="M30 60V30H60" fill="none" stroke="#C6FF3D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M970 240v30h-30" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- label -->
    <text x="70" y="82" font-family="'Courier New', Consolas, monospace" font-size="16" fill="#22D3EE" letter-spacing="2">
      // hello, world
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    </text>

    <!-- name -->
    <text x="68" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" fill="url(#accent)" letter-spacing="-1">
      Ayush Sonewane
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <!-- rotating role line -->
    <g font-family="'Courier New', Consolas, monospace" font-size="26" font-weight="700">
      <text x="72" y="208" fill="#C6FF3D">&gt;</text>
      <text x="104" y="208" fill="#FFFFFF" opacity="0">
        Flutter Developer
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.02;0.2;0.23;1" values="0;1;1;0;0"/>
      </text>
      <text x="104" y="208" fill="#FFFFFF" opacity="0">
        Full-Stack Builder
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.45;0.48;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="104" y="208" fill="#FFFFFF" opacity="0">
        Cross-Platform Engineer
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.7;0.73;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="104" y="208" fill="#FFFFFF" opacity="0">
        MCA Student &amp; Problem Solver
        <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.75;0.77;0.95;0.98;1" values="0;0;1;1;0;0"/>
      </text>
    </g>

    <!-- footer line -->
    <text x="70" y="256" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#9CA3AF" letter-spacing="1">
      Flutter  ·  React  ·  PHP  ·  MySQL   |   Nagpur, India
    </text>

    <!-- animated accent bar -->
    <rect x="0" y="292" width="1000" height="8" fill="url(#accent)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
