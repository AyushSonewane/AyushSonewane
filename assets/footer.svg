<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6FF3D"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="110" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="110" fill="#0A0A0F"/>
    <rect y="0" width="1000" height="4" fill="url(#accent)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="62" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="20" fill="#FFFFFF" letter-spacing="1">
      Thanks for stopping by.  Let's build something awesome.
    </text>
    <text x="500" y="90" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#7C5CFF">
      // made with caffeine and Flutter
    </text>
  </g>
</svg>
